<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Buy Products | Hosiery Marketplace</title>

<link rel="stylesheet" href="style.css">

<style>
.buy-header {
    padding: 40px 10%;
    text-align: center;
}

.filter-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 0 10% 30px;
}

.filter-bar select {
    padding: 8px 12px;
    border-radius: 6px;
    border: 1px solid #ccc;
    font-size: 14px;
}

.product-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 25px;
    padding: 0 10% 60px;
}

.product-card {
    background: white;
    padding: 20px;
    border-radius: 12px;
    box-shadow: 0 5px 15px rgba(0,0,0,0.08);
    transition: transform 0.2s;
}

.product-card:hover {
    transform: translateY(-4px);
}

.product-card h4 {
    margin-bottom: 10px;
    color: #2c3e50;
}

.price {
    font-size: 1.2rem;
    font-weight: bold;
    color: #e67e22;
    margin-bottom: 15px;
}

.quantity {
    display: flex;
    align-items: center;
    gap: 10px;
}

.quantity input {
    width: 60px;
    padding: 6px;
    text-align: center;
}
</style>
</head>

<body>

<header>
    <h1>Hosiery Marketplace</h1>
    <nav>
        <ul>
            <li><a href="homepage.html">Home</a></li>
            <li><a href="buy.html">Buy</a></li>
            <li><a href="sell.html">Sell</a></li>
            <li><a href="#helpline" class="btn-help">Helpline</a></li>
        </ul>
    </nav>
</header>

<section class="buy-header">
    <h2>Buy Hosiery Products</h2>
    <p>Select from a range of premium hosiery items</p>
</section>

<div class="filter-bar">
    <strong>Sort by price:</strong>
    <select id="sortPrice">
        <option value="low">Low to High</option>
        <option value="high">High to Low</option>
    </select>
</div>

<div id="root"></div>

<footer>
    <p>&copy; 2026 Hosiery Marketplace Platform. All rights reserved.</p>
</footer>

<script src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/babel-standalone@6/babel.min.js"></script>

<script type="text/babel">

function App() {

    const defaultProducts = [
        { name: "Cotton Ankle Socks", price: 149 },
        { name: "Wool Winter Socks", price: 249 },
        { name: "Formal Stockings", price: 199 },
        { name: "Sports Crew Socks", price: 179 },
        { name: "Thermal Hosiery Set", price: 399 },
        { name: "Kids Soft Socks", price: 99 }
    ];

    const [products, setProducts] = React.useState(defaultProducts);

    React.useEffect(() => {
        const stored = JSON.parse(localStorage.getItem("products")) || [];
        setProducts([...defaultProducts, ...stored]);
    }, []);

    function sortProducts(value) {
        let sorted = [...products];

        if (value === "low") {
            sorted.sort((a, b) => a.price - b.price);
        } else {
            sorted.sort((a, b) => b.price - a.price);
        }

        setProducts(sorted);
    }

    React.useEffect(() => {
        const select = document.getElementById("sortPrice");
        select.addEventListener("change", (e) => sortProducts(e.target.value));
    }, [products]);

    return (
        <div className="product-grid">
            {products.map((product, index) => (
                <div className="product-card" key={index}>
                    <h4>{product.name}</h4>
                    <div className="price">₹{product.price}</div>

                    <div className="quantity">
                        <label>Qty:</label>
                        <input type="number" min="1" defaultValue="1" />
                    </div>
                </div>
            ))}
        </div>
    );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);

</script>

</body>
</html>
