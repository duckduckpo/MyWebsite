<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>User Login</title>

<style>

  body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    margin: 0;
  }

  .form-container {
    background: rgba(255, 255, 255, 0.95);
    padding: 40px;
    border-radius: 15px;
    box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
    width: 350px;
    transition: transform 0.3s ease;
  }

  .form-container:hover {
    transform: translateY(-5px);
  }

  h1 {
    text-align: center;
    color: #333;
    margin-bottom: 30px;
    font-weight: 600;
  }

  label {
    display: block;
    margin-top: 15px;
    margin-bottom: 8px;
    color: #555;
    font-size: 14px;
    font-weight: 600;
  }

  input {
    width: 100%;
    padding: 12px;
    box-sizing: border-box;
    border: 2px solid #eee;
    border-radius: 8px;
    transition: all 0.3s ease;
    outline: none;
  }

  input:focus {
    border-color: #764ba2;
    box-shadow: 0 0 8px rgba(118, 75, 162, 0.2);
  }

  input[type="submit"] {
    background: linear-gradient(to right, #f88e02, #ffac33);
    color: white;
    border: none;
    margin-top: 30px;
    cursor: pointer;
    font-size: 16px;
    font-weight: bold;
    text-transform: uppercase;
    letter-spacing: 1px;
    padding: 14px;
  }

  input[type="submit"]:hover {
    background: linear-gradient(to right, #e07b02, #f88e02);
    box-shadow: 0 5px 15px rgba(248, 142, 2, 0.4);
  }
</style>
</head>

<body>

<div class="form-container">
  <h1>User Login</h1>

  <form onsubmit="loginUser(event)">
    
    <label for="username">Username</label>
    <input type="text" id="username" placeholder="Enter your username" required>

    <label for="pwd">Password</label>
    <input type="password" id="pwd" placeholder="••••••••" required>

    <label for="DOB">Date of Birth</label>
    <input type="date" id="DOB" required>

    <label for="email">Email Address</label>
    <input type="email" id="email" placeholder="name@example.com" required>

    <input type="submit" value="Log In">
  </form>
</div>

<script>
function loginUser(event) {
    event.preventDefault();

    const username = document.getElementById("username").value;
    const password = document.getElementById("pwd").value;
    const dob = document.getElementById("DOB").value;
    const email = document.getElementById("email").value;

    if (!username || !password || !dob || !email) {
        alert("Please fill all fields");
        return;
    }

    localStorage.setItem("user", JSON.stringify({
        username,
        email
    }));

    alert("Login successful!");

    window.location.href = "homepage.html";
}
</script>

</body>
</html>
